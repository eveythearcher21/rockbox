# SNARTY Y1 adaptation of SNARTY 1.0 by Simon Andén / Tirim4 (2025).
# Based on SPAZZ, SNAZZ/SNAZZ2, SNAZZY, and adwaitapod; CC-BY-SA 4.0.
# Original supplied theme targets 320x240; this layout targets the Y1 at 480x360.
wps: SNARTY-Y1.wps
sbs: SNARTY-Y1.sbs
fms: -
iconset: SNARTY.bmp
viewers iconset: SNARTY_viewer.bmp
font: 22-KodeMono-SemiBold.fnt
background color: 232234
foreground color: a2accd
backdrop: -
filetype colours: -
show icons: on
selector type: bar (inverse)
scrollbar: off
root menu order: database, songs, artists, playlists, genre, year, search, settings, system_menu, wps
start in screen: root
gather runtime data: on
playlist viewer track display: title from tags
